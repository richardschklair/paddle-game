<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>What's Your Patronus?</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05000f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      color: #f5e6c8;
      overflow: hidden;
    }

    /* Floating particles background */
    #particles-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 620px;
      padding: 24px;
    }

    /* Intro screen */
    #intro { text-align: center; animation: fadeUp 0.6s ease; }
    #intro h1 {
      font-size: 42px;
      color: #ffe680;
      text-shadow: 0 0 30px rgba(255,230,128,0.7), 0 0 60px rgba(160,128,255,0.3);
      margin-bottom: 8px;
    }
    #intro .tagline {
      color: #a080ff;
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 32px;
    }
    #intro p {
      color: #c8b88a;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 36px;
      background: #0d0520;
      border: 1px solid #2a1550;
      border-radius: 12px;
      padding: 20px 24px;
    }
    #start-btn {
      background: linear-gradient(135deg, #a080ff, #6040cc);
      border: none;
      border-radius: 10px;
      padding: 16px 52px;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(160,128,255,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(160,128,255,0.8); }

    /* Quiz screen */
    #quiz { display: none; animation: fadeUp 0.5s ease; }
    #progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }
    #progress-bar-bg {
      flex: 1;
      background: #1a0a2e;
      border-radius: 8px;
      height: 6px;
      overflow: hidden;
      border: 1px solid #3a1f5c;
    }
    #progress-bar { height: 100%; background: linear-gradient(90deg, #a080ff, #ffe680); border-radius: 8px; transition: width 0.5s ease; }
    #progress-label { font-size: 13px; color: #888; white-space: nowrap; }

    #question-card {
      background: #0d0520;
      border: 1px solid #3a1f5c;
      border-radius: 14px;
      padding: 30px 28px 24px;
      margin-bottom: 18px;
    }
    #question-text {
      font-size: 22px;
      line-height: 1.5;
      color: #f5e6c8;
    }

    #options { display: flex; flex-direction: column; gap: 12px; }
    .option-btn {
      background: #0d0520;
      border: 1px solid #3a1f5c;
      border-radius: 10px;
      padding: 16px 20px;
      color: #d8c8f0;
      font-family: 'Georgia', serif;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
      line-height: 1.4;
    }
    .option-btn:hover:not(:disabled) {
      background: #1e0a3e;
      border-color: #a080ff;
      transform: translateX(6px);
      box-shadow: -4px 0 12px rgba(160,128,255,0.3);
    }
    .option-btn.selected {
      background: #2a1060;
      border-color: #ffe680;
      color: #ffe680;
      transform: translateX(6px);
    }
    .option-btn:disabled { cursor: default; }

    #next-btn {
      display: none;
      margin: 20px auto 0;
      background: linear-gradient(135deg, #a080ff, #7040cc);
      border: none;
      border-radius: 10px;
      padding: 14px 44px;
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 17px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    #next-btn:hover { opacity: 0.85; transform: scale(1.03); }

    /* Result screen */
    #result { display: none; text-align: center; animation: revealResult 0.8s ease; }
    @keyframes revealResult {
      0% { opacity: 0; transform: scale(0.85); }
      60% { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    #result-title { font-size: 18px; color: #a080ff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
    #patronus-name {
      font-size: 52px;
      font-weight: bold;
      color: #ffe680;
      text-shadow: 0 0 40px rgba(255,230,128,0.8), 0 0 80px rgba(160,128,255,0.4);
      margin-bottom: 12px;
    }
    #patronus-emoji { font-size: 72px; margin-bottom: 18px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    #patronus-card {
      background: #0d0520;
      border: 1px solid #3a1f5c;
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 24px;
      text-align: left;
    }
    #patronus-traits {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .trait-chip {
      background: #2a1060;
      border: 1px solid #6040cc;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      color: #c8a8ff;
    }
    #patronus-desc { font-size: 15px; color: #c8b88a; line-height: 1.7; }
    #patronus-famous { font-size: 13px; color: #888; margin-top: 10px; font-style: italic; }

    #play-again {
      background: linear-gradient(135deg, #ffe680, #cc9900);
      border: none;
      border-radius: 10px;
      padding: 15px 48px;
      color: #000;
      font-family: 'Georgia', serif;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 0 20px rgba(255,230,128,0.4);
    }
    #play-again:hover { transform: scale(1.05); box-shadow: 0 0 36px rgba(255,230,128,0.7); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<canvas id="particles-bg"></canvas>
<div id="app">

  <!-- Intro -->
  <div id="intro">
    <h1>⚡ Expecto Patronum ⚡</h1>
    <p class="tagline">Discover Your Patronus</p>
    <p>
      The Patronus is a powerful charm that takes the form of an animal guardian —
      a reflection of your innermost self. Answer five questions honestly and the
      magic will reveal the creature that protects your soul.
    </p>
    <button id="start-btn">Begin the Charm →</button>
  </div>

  <!-- Quiz -->
  <div id="quiz">
    <div id="progress-wrap">
      <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
      <span id="progress-label">1 / 5</span>
    </div>
    <div id="question-card">
      <div id="question-text"></div>
    </div>
    <div id="options"></div>
    <button id="next-btn">Continue →</button>
  </div>

  <!-- Result -->
  <div id="result">
    <div id="result-title">Your Patronus is</div>
    <div id="patronus-emoji"></div>
    <div id="patronus-name"></div>
    <div id="patronus-card">
      <div id="patronus-traits"></div>
      <div id="patronus-desc"></div>
      <div id="patronus-famous"></div>
    </div>
    <button id="play-again">🔮 Try Again</button>
  </div>
</div>

<script>
  // --- Patronus definitions ---
  const PATRONUSES = {
    stag: {
      name: 'Stag',
      emoji: '🦌',
      traits: ['Noble', 'Brave', 'Protective'],
      desc: 'You carry yourself with quiet dignity and stand tall in the face of danger. You are fiercely protective of those you love and lead by example. The stag represents courage, strength, and an unshakeable moral compass.',
      famous: 'Famous bearer: Harry Potter himself.',
    },
    otter: {
      name: 'Otter',
      emoji: '🦦',
      traits: ['Clever', 'Playful', 'Loyal'],
      desc: 'Your quick mind and warm heart make you beloved by all. You solve problems with creativity and never lose your sense of joy. You form deep, lasting bonds and bring light to every room you enter.',
      famous: 'Famous bearer: Hermione Granger.',
    },
    phoenix: {
      name: 'Phoenix',
      emoji: '🔥',
      traits: ['Wise', 'Resilient', 'Powerful'],
      desc: 'You have faced hardship and risen stronger every time. Your wisdom runs deep and your spirit cannot be extinguished. You inspire those around you to be better, and in your darkest hour you find your greatest strength.',
      famous: 'Famous bearer: Albus Dumbledore.',
    },
    wolf: {
      name: 'Wolf',
      emoji: '🐺',
      traits: ['Fierce', 'Loyal', 'Instinctive'],
      desc: 'You are fiercely devoted to your pack — the people who matter most to you. You trust your gut, act decisively, and never back down from a threat. Beneath your fierce exterior is a deeply loyal heart.',
      famous: 'Rare and powerful — a true guardian of the wild.',
    },
    doe: {
      name: 'Doe',
      emoji: '🫎',
      traits: ['Gentle', 'Selfless', 'Loving'],
      desc: 'Your love for others is the most powerful magic you possess. You give freely, forgive deeply, and inspire loyalty through pure warmth. Your gentleness is not weakness — it is extraordinary strength.',
      famous: 'Famous bearer: Lily Potter & Severus Snape.',
    },
    dolphin: {
      name: 'Dolphin',
      emoji: '🐬',
      traits: ['Joyful', 'Social', 'Intelligent'],
      desc: 'You light up every space you inhabit. Quick-witted and deeply empathetic, you read people effortlessly and bring out the best in them. You find joy in connection and thrive when surrounded by those you love.',
      famous: 'A rare Patronus — only the most warm-hearted wizards produce one.',
    },
    hare: {
      name: 'Hare',
      emoji: '🐇',
      traits: ['Free-spirited', 'Creative', 'Unique'],
      desc: 'You see the world differently from everyone else — and that is your greatest gift. Imaginative and independent, you follow your own path with quiet confidence. The unusual doesn\'t frighten you; it fascinates you.',
      famous: 'Famous bearer: Luna Lovegood.',
    },
    fox: {
      name: 'Fox',
      emoji: '🦊',
      traits: ['Cunning', 'Adaptable', 'Sharp'],
      desc: 'You are always three steps ahead. Resourceful and sharp-minded, you find solutions where others see only obstacles. You adapt effortlessly to any situation and have a gift for reading people with uncanny accuracy.',
      famous: 'A cunning and rare Patronus for the quick of mind.',
    },
  };

  // --- Questions ---
  // Each option maps to two patronus keys with +2 points each
  const QUESTIONS = [
    {
      text: 'What do you value above all else?',
      options: [
        { text: 'Courage and honour', maps: ['stag', 'wolf'] },
        { text: 'Knowledge and cleverness', maps: ['otter', 'fox'] },
        { text: 'Love and deep connection', maps: ['doe', 'dolphin'] },
        { text: 'Freedom and wonder', maps: ['hare', 'phoenix'] },
      ],
    },
    {
      text: 'When danger approaches, what do you do?',
      options: [
        { text: 'Step forward — you\'ll face it head on', maps: ['stag', 'wolf'] },
        { text: 'Think fast and find the smartest solution', maps: ['otter', 'fox'] },
        { text: 'Make sure everyone around you is safe first', maps: ['doe', 'dolphin'] },
        { text: 'Trust your instincts — something unexpected', maps: ['hare', 'phoenix'] },
      ],
    },
    {
      text: 'Your friends would most likely describe you as…',
      options: [
        { text: 'Brave, dependable, and strong', maps: ['stag', 'wolf'] },
        { text: 'Witty, sharp, and resourceful', maps: ['otter', 'fox'] },
        { text: 'Warm, caring, and selfless', maps: ['doe', 'dolphin'] },
        { text: 'Original, quirky, and wonderfully strange', maps: ['hare', 'phoenix'] },
      ],
    },
    {
      text: 'What would you find at the end of a long, dark corridor?',
      options: [
        { text: 'Something worth protecting', maps: ['stag', 'doe'] },
        { text: 'A puzzle waiting to be solved', maps: ['otter', 'fox'] },
        { text: 'A friend who needs you', maps: ['dolphin', 'wolf'] },
        { text: 'Something magical and unknown', maps: ['hare', 'phoenix'] },
      ],
    },
    {
      text: 'Which of these speaks to your soul?',
      options: [
        { text: '"It takes a great deal of bravery to stand up to our enemies — but just as much to stand up to our friends."', maps: ['stag', 'wolf'] },
        { text: '"When in doubt, go to the library."', maps: ['otter', 'fox'] },
        { text: '"Things we lose have a way of coming back to us in the end."', maps: ['doe', 'dolphin'] },
        { text: '"The things we love tell us what we are."', maps: ['hare', 'phoenix'] },
      ],
    },
  ];

  // --- State ---
  let current = 0;
  let scores = {};
  let selectedOption = null;

  function resetScores() {
    scores = {};
    Object.keys(PATRONUSES).forEach(k => scores[k] = 0);
  }

  // --- Particle background ---
  const bgCanvas = document.getElementById('particles-bg');
  const bgCtx = bgCanvas.getContext('2d');
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  window.addEventListener('resize', () => { bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight; });

  const sparks = Array.from({ length: 60 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -Math.random() * 0.4 - 0.1,
    r: Math.random() * 1.8 + 0.4,
    alpha: Math.random() * 0.5 + 0.1,
    color: Math.random() > 0.5 ? '#a080ff' : '#ffe680',
  }));

  function animateBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    sparks.forEach(s => {
      s.x += s.vx; s.y += s.vy;
      if (s.y < -4) { s.y = bgCanvas.height + 4; s.x = Math.random() * bgCanvas.width; }
      bgCtx.globalAlpha = s.alpha;
      bgCtx.fillStyle = s.color;
      bgCtx.beginPath();
      bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      bgCtx.fill();
    });
    bgCtx.globalAlpha = 1;
    requestAnimationFrame(animateBg);
  }
  animateBg();

  // --- Quiz logic ---
  function startQuiz() {
    current = 0;
    selectedOption = null;
    resetScores();
    document.getElementById('intro').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
    showQuestion();
  }

  function showQuestion() {
    selectedOption = null;
    const q = QUESTIONS[current];
    document.getElementById('progress-bar').style.width = `${(current / QUESTIONS.length) * 100}%`;
    document.getElementById('progress-label').textContent = `${current + 1} / ${QUESTIONS.length}`;
    document.getElementById('question-text').textContent = q.text;
    document.getElementById('next-btn').style.display = 'none';

    const optsEl = document.getElementById('options');
    optsEl.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.text;
      btn.addEventListener('click', () => selectOption(btn, i));
      optsEl.appendChild(btn);
    });
  }

  function selectOption(btn, index) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = index;
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('next-btn').textContent = current < QUESTIONS.length - 1 ? 'Continue →' : 'Reveal My Patronus ⚡';
  }

  document.getElementById('next-btn').addEventListener('click', () => {
    if (selectedOption === null) return;
    const maps = QUESTIONS[current].options[selectedOption].maps;
    maps.forEach(k => scores[k] += 2);
    current++;
    if (current < QUESTIONS.length) {
      showQuestion();
    } else {
      showResult();
    }
  });

  function showResult() {
    document.getElementById('quiz').style.display = 'none';
    const resultEl = document.getElementById('result');
    resultEl.style.display = 'block';

    const winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
    const p = PATRONUSES[winner];

    document.getElementById('patronus-emoji').textContent = p.emoji;
    document.getElementById('patronus-name').textContent = p.name;
    document.getElementById('patronus-desc').textContent = p.desc;
    document.getElementById('patronus-famous').textContent = p.famous;

    const traitsEl = document.getElementById('patronus-traits');
    traitsEl.innerHTML = '';
    p.traits.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'trait-chip';
      chip.textContent = t;
      traitsEl.appendChild(chip);
    });
  }

  document.getElementById('start-btn').addEventListener('click', startQuiz);
  document.getElementById('play-again').addEventListener('click', () => {
    document.getElementById('result').style.display = 'none';
    document.getElementById('intro').style.display = 'block';
  });
</script>
</body>
</html>
