<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paddle Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    #ui {
      width: 480px;
      display: flex;
      justify-content: space-between;
      padding: 10px 4px;
      font-size: 20px;
    }
    #lives { color: #e94560; }
    #score-val { color: #00d4ff; }
    canvas {
      border: 2px solid #333;
      display: block;
    }
    #hint {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="ui">
    <span>Lives: <span id="lives">♥ ♥ ♥</span></span>
    <span>Score: <span id="score-val">0</span></span>
  </div>
  <canvas id="canvas" width="480" height="580"></canvas>
  <div id="hint">← → Arrow keys to move</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives');
    const scoreEl = document.getElementById('score-val');

    const W = canvas.width;
    const H = canvas.height;

    const PADDLE_W = 90;
    const PADDLE_H = 12;
    const PADDLE_Y = H - 40;
    const PADDLE_SPEED = 8;
    const BALL_R = 9;
    const BASE_SPEED = 5;

    let paddle, ball, lives, score, state, keys;

    function resetBall() {
      const angle = (Math.random() * 60 + 30) * (Math.PI / 180);
      const dir = Math.random() > 0.5 ? 1 : -1;
      ball = {
        x: W / 2,
        y: H / 2,
        dx: BASE_SPEED * Math.cos(angle) * dir,
        dy: -BASE_SPEED * Math.sin(angle) - 1,
      };
    }

    function init() {
      paddle = { x: W / 2 - PADDLE_W / 2 };
      lives = 3;
      score = 0;
      state = 'waiting'; // waiting -> playing -> lost_life -> gameover
      keys = {};
      resetBall();
      updateUI();
    }

    function updateUI() {
      livesEl.textContent = '♥ '.repeat(lives).trim() || '';
      scoreEl.textContent = score;
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
      if (state === 'waiting' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        state = 'playing';
      }
      if (state === 'gameover' && e.key === 'Enter') init();
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    function update() {
      // Paddle movement
      if (keys['ArrowLeft']) paddle.x = Math.max(0, paddle.x - PADDLE_SPEED);
      if (keys['ArrowRight']) paddle.x = Math.min(W - PADDLE_W, paddle.x + PADDLE_SPEED);

      if (state !== 'playing') return;

      ball.x += ball.dx;
      ball.y += ball.dy;

      // Left / right walls
      if (ball.x - BALL_R <= 0) { ball.x = BALL_R; ball.dx = Math.abs(ball.dx); }
      if (ball.x + BALL_R >= W) { ball.x = W - BALL_R; ball.dx = -Math.abs(ball.dx); }

      // Top wall
      if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.dy = Math.abs(ball.dy); }

      // Paddle collision
      const px = paddle.x;
      const py = PADDLE_Y;
      if (
        ball.dy > 0 &&
        ball.y + BALL_R >= py &&
        ball.y + BALL_R <= py + PADDLE_H + Math.abs(ball.dy) &&
        ball.x + BALL_R >= px &&
        ball.x - BALL_R <= px + PADDLE_W
      ) {
        ball.y = py - BALL_R;
        const hit = (ball.x - px) / PADDLE_W; // 0..1
        const angle = (hit - 0.5) * 140 * (Math.PI / 180);
        const speed = Math.min(BASE_SPEED + score * 0.05, 12);
        ball.dx = speed * Math.sin(angle);
        ball.dy = -speed * Math.cos(angle);
        score++;
        updateUI();
      }

      // Ball exits bottom
      if (ball.y - BALL_R > H) {
        lives--;
        updateUI();
        if (lives <= 0) {
          state = 'gameover';
        } else {
          state = 'waiting';
          resetBall();
        }
      }
    }

    function drawPaddle() {
      const grad = ctx.createLinearGradient(paddle.x, PADDLE_Y, paddle.x, PADDLE_Y + PADDLE_H);
      grad.addColorStop(0, '#ff6b8a');
      grad.addColorStop(1, '#e94560');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
      ctx.fill();
    }

    function drawBall() {
      const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, BALL_R);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#00d4ff');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOverlay(title, sub) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 52px monospace';
      ctx.fillText(title, W / 2, H / 2 - 30);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText(sub, W / 2, H / 2 + 20);
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0d0d1a';
      ctx.fillRect(0, 0, W, H);

      // Dashed goal line at bottom
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = '#2a2a4a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, H - 10);
      ctx.lineTo(W, H - 10);
      ctx.stroke();
      ctx.setLineDash([]);

      drawPaddle();
      drawBall();

      if (state === 'waiting') {
        drawOverlay('READY', 'Press ← or → to launch');
      } else if (state === 'gameover') {
        drawOverlay('GAME OVER', `Score: ${score}   Press Enter to restart`);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
